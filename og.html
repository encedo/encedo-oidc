<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og</title>
<!-- Source of og.png (1200×630), the card social networks show for the landing.
     Same tokens as landing.html. Regenerate after editing:
       chromium --headless=new --disable-gpu --no-sandbox --hide-scrollbars \
         --force-device-scale-factor=1 --window-size=1200,630 --virtual-time-budget=4000 \
         --screenshot=og.png file://$PWD/og.html
     (snap Chromium cannot write to /tmp -- run it from the repo directory.) -->
<style>
  :root {
    --paper: #14103a; --ink: #ece9f5; --muted: #a79ec6; --purple: #b98fd4; --green: #2ecc71;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; background: var(--paper); color: var(--ink);
    font-family: var(--sans); -webkit-font-smoothing: antialiased;
    padding: 68px 80px 0; display: flex; flex-direction: column;
    position: relative; overflow: hidden;
  }
  .top {
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: var(--mono); font-size: 21px; letter-spacing: .04em; color: var(--muted);
  }
  .top b { color: var(--ink); font-weight: 500; }
  h1 {
    margin-top: 54px; font-size: 76px; line-height: 1.06; letter-spacing: -.035em;
    font-weight: 700; max-width: 20ch;
  }
  h1 .soft { color: var(--purple); }
  .foot {
    position: absolute; left: 80px; bottom: 76px;
    font-family: var(--mono); font-size: 21px; letter-spacing: .01em; color: var(--muted); white-space: nowrap;
  }
  .foot .sig { color: var(--purple); }
  .foot .ok { color: var(--green); }
  .rule { position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: var(--purple); }
</style>
</head>
<body>
  <div class="top">
    <span><b>Encedo OIDC</b> &nbsp;an OpenID Connect provider</span>
    <span>RKV sp. z o.o. &middot; MIT</span>
  </div>
  <h1>Identity nobody can steal.<br><span class="soft">Not even the provider.</span></h1>
  <div class="foot">
    server builds <span class="sig">signing_input</span> &rarr; your module signs &rarr; server <span class="ok">verifies</span>, cannot forge
  </div>
  <div class="rule"></div>
</body>
</html>
